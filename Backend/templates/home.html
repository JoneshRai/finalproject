<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Poppins:wght@200&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
    <title>Chat Rooms</title>
    <style>
        body {
            background-color: #dbdbdb;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin: 20px;
        }

        .form-container {
            width: 45%;
            border: 2px solid #dedede;
            background-color: #f1f1f1;
            border-radius: 5px;
            padding: 20px;
        }

        .rooms-container {
            width: 45%;
            border: 2px solid #dedede;
            background-color: #f1f1f1;
            border-radius: 5px;
            padding: 20px;
            margin-left: 20px;
        }

        .rooms-container ul {
            list-style-type: none;
            padding: 0;
        }

        .rooms-container li {
            background-color: #e3e3e3;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }

        #input1, #input2 {
            border-radius: 25px;
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        input[type=submit] {
            width: 100%;
            background-color: #333333;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type=submit]:hover {
            background-color: #120061;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <form id="post-form" method="POST" action="checkview">
                {% csrf_token %}
                <label for="room_name">Room Name</label>
                <input id="input1" class="form-control" type="text" name="room_name" required>
                <label for="username">Username</label>
                <input id="input2" class="form-control" type="text" name="username" required>
                <input type="submit" value="Start Chat Now!">
            </form>
        </div>

        <div class="rooms-container">
            <h4>Available Rooms</h4>
            <ul>
                {% for room in rooms %}
                    <li>
                        <a href="{% url 'room-detail' room.name %}?username={{ request.GET.username }}">{{ room.name }}</a>
                    </li>
                {% empty %}
                    <li>No rooms available.</li>
                {% endfor %}
            </ul>
            
        </div>
    </div>
</body>
</html>
